<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="a1-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
    <marker id="a1-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf8700"/>
    </marker>
    <marker id="a1-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="#ffffff"/>

  <!-- Webview -->
  <rect x="40" y="30" width="920" height="120" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="64" y="62" font-size="15" font-weight="600" fill="#1f2328">Webview 窗口</text>
  <text x="184" y="62" font-size="12" fill="#8c959f">WKWebView / WebView2 / WebKitGTK</text>
  <text x="64" y="88" font-size="13" fill="#1f2328">index.html · app.js · app.css —— 手写，无框架，go:embed 进二进制</text>
  <text x="64" y="112" font-size="12" fill="#656d76">页面本身也由同一个 handler 提供：macOS / Linux 是 wails:// ，Windows 是 http://wails.localhost</text>

  <!-- HTTP 通道 -->
  <line x1="230" y1="154" x2="230" y2="238" stroke="#0969da" stroke-width="3" marker-end="url(#a1-blue)"/>
  <text x="250" y="184" font-size="13" font-weight="600" fill="#0969da">fetch("/api/…")</text>
  <text x="250" y="206" font-size="12" fill="#656d76">HTTP JSON · 同一个进程</text>

  <!-- 原生消息通道 -->
  <line x1="790" y1="154" x2="790" y2="238" stroke="#bf8700" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a1-amber)"/>
  <text x="770" y="184" font-size="13" font-weight="600" fill="#9a6700" text-anchor="end">/wails/runtime.js</text>
  <text x="770" y="206" font-size="12" fill="#656d76" text-anchor="end">webview 原生消息通道</text>

  <!-- 被划掉的 bindings -->
  <rect x="420" y="164" width="180" height="60" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <text x="510" y="191" font-size="13" fill="#8c959f" text-anchor="middle">生成的 bindings</text>
  <line x1="458" y1="186" x2="562" y2="186" stroke="#8c959f" stroke-width="1.5"/>
  <text x="510" y="212" font-size="12" fill="#8c959f" text-anchor="middle">不存在这一步</text>

  <!-- Go -->
  <rect x="40" y="250" width="920" height="320" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="64" y="284" font-size="15" font-weight="600" fill="#1f2328">Go 进程</text>
  <text x="152" y="284" font-size="12" fill="#8c959f">一个二进制：没有 Node，没有生成的代码</text>

  <!-- box 1 -->
  <rect x="64" y="306" width="272" height="160" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="80" y="336" font-size="14" font-weight="600" fill="#1f2328">http.ServeMux</text>
  <text x="80" y="362" font-size="12" fill="#0969da">GET  /</text>
  <text x="142" y="362" font-size="12" fill="#656d76">→ 静态资源（go:embed）</text>
  <text x="80" y="386" font-size="12" fill="#0969da">GET  /api/state</text>
  <text x="196" y="386" font-size="12" fill="#656d76">→ JSON</text>
  <text x="80" y="410" font-size="12" fill="#0969da">POST /api/window/{action}</text>
  <text x="80" y="434" font-size="12" fill="#656d76">→ FitPanel / Copy / …</text>
  <text x="80" y="454" font-size="11" fill="#8c959f">页面和 API 是同一个 handler</text>

  <line x1="340" y1="386" x2="356" y2="386" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a1-gray)"/>
  <line x1="636" y1="386" x2="652" y2="386" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a1-gray)"/>

  <!-- box 2 -->
  <rect x="360" y="306" width="272" height="160" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="376" y="336" font-size="14" font-weight="600" fill="#1f2328">Windows 接口</text>
  <text x="376" y="362" font-size="12" fill="#1f2328">HidePanel() · ShowMain(view)</text>
  <text x="376" y="386" font-size="12" fill="#1f2328">OpenURL() · OpenFolder(path)</text>
  <text x="376" y="410" font-size="12" fill="#1f2328">Copy(text) · FitPanel(h, g)</text>
  <text x="376" y="434" font-size="12" fill="#1f2328">TintPanel(rgba, ms) · Quit()</text>
  <text x="376" y="454" font-size="11" fill="#8c959f">原生动作都在这一个接口收口</text>

  <!-- box 3 -->
  <rect x="656" y="306" width="272" height="160" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="672" y="336" font-size="14" font-weight="600" fill="#1f2328">平台原生 API</text>
  <text x="672" y="362" font-size="12" fill="#1f2328">macOS　<tspan fill="#656d76">Cocoa（ObjC · cgo）</tspan></text>
  <text x="672" y="386" font-size="12" fill="#1f2328">Linux　<tspan fill="#656d76">GTK3 + WebKitGTK</tspan></text>
  <text x="672" y="410" font-size="12" fill="#1f2328">Windows　<tspan fill="#656d76">Win32 · 注册表</tspan></text>
  <text x="672" y="454" font-size="11" fill="#8c959f">NativeWindow() + InvokeSync</text>

  <!-- 脚注 -->
  <text x="500" y="502" font-size="12" fill="#656d76" text-anchor="middle">安全边界：页面不传路径 —— /api/settings/reveal 只打开 settings.Dir()</text>
  <text x="500" y="528" font-size="12" fill="#656d76" text-anchor="middle">唯一的非 HTTP 通道：只有关闭窗口、最大化、拖拽在走 /wails/runtime.js</text>
</svg>
